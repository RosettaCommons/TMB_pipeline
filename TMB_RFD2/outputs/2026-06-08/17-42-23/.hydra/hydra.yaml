hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=RUN
    task:
    - contigmap.has_termini=[True]
    - inference.output_prefix=/home/aphilo/TMB_pipeline/TMB_RFD2/glycine_twist_position_sampling_backbones_out_dir_n14/glycine_twists_no_masking_model_n14_nres16_2_7/TMB_RFD2/n14nres16
    - scaffoldguided.scaffold_dir=/home/aphilo/TMB_pipeline/TMB_RFD2/adj_ss_glytwist_pt_files_out_dir/n14_nres16_glycine_twists_2_7
    - contigmap.contigs=['1-1']
    - inference.ckpt_path=/home/aphilo/TMB_pipeline/weights/TMB_RFD2.pt
    - inference.input_pdb=/home/aphilo/TMB_pipeline/TMB_RFD2/dummy.pdb
    - inference.num_designs=10
    - ++transforms.configs.CenterPostTransform.center_type=all
    - ++glycine_twists.glycine_twists_res="22,23,24,25,26,102,103,104,105,106"
  job:
    name: run_inference
    chdir: null
    override_dirname: ++glycine_twists.glycine_twists_res="22,23,24,25,26,102,103,104,105,106",++transforms.configs.CenterPostTransform.center_type=all,contigmap.contigs=['1-1'],contigmap.has_termini=[True],inference.ckpt_path=/home/aphilo/TMB_pipeline/weights/TMB_RFD2.pt,inference.input_pdb=/home/aphilo/TMB_pipeline/TMB_RFD2/dummy.pdb,inference.num_designs=10,inference.output_prefix=/home/aphilo/TMB_pipeline/TMB_RFD2/glycine_twist_position_sampling_backbones_out_dir_n14/glycine_twists_no_masking_model_n14_nres16_2_7/TMB_RFD2/n14nres16,scaffoldguided.scaffold_dir=/home/aphilo/TMB_pipeline/TMB_RFD2/adj_ss_glytwist_pt_files_out_dir/n14_nres16_glycine_twists_2_7
    id: ???
    num: ???
    config_name: aa_ppi
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.1
    version_base: '1.3'
    cwd: /home/aphilo/TMB_pipeline/TMB_RFD2
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /home/aphilo/TMB_pipeline/TMB_RFD2/TMB_RFD2_code/rf_diffusion/config/inference
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /home/aphilo/TMB_pipeline/TMB_RFD2/outputs/2026-06-08/17-42-23
    choices:
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
