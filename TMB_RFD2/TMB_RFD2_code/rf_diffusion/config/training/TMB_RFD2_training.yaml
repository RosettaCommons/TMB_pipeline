###### change datasets
datahub:
  n_train: 24000  # Total number of training examples per epoch. Must be divisible by `ddp.accum`.
  n_fallback_retries: 10
  train:
    # ... train datasets
    pdb_monomer:
      probability: 0.2
      sub_datasets:
        pn_unit:
          dataset: 
            _target_: datahub.datasets.base.StructuralDatasetWrapper
            save_failed_examples_to_dir: null
            cif_parser:
              _target_: cifutils.CIFParser
            cif_parser_args:
              load_from_cache: True
              save_to_cache: True
              cache_dir: /net/tukwila/sagardip/rfdiff_train/croppedAFDset_highPDB/pdb
            dataset_parser:
              _target_: datahub.datasets.dataframe_parsers.PNUnitsDFParser
            dataset:
              _target_: datahub.datasets.base.PandasDataset
              name: pn_unit
              id_column: example_id
              data: /projects/ml/RF2_allatom/datasets/pdb/2024_09_10/pn_units_df.parquet
              filters:
                - "resolution < 9.0 and ~method.str.contains('NMR')"
                - "num_polymer_pn_units <= 300" 
                - "cluster.notnull()"
                # - "~(q_pn_unit_non_polymer_res_names.notnull() and q_pn_unit_non_polymer_res_names.str.contains('${resolve_import:cifutils.constants.AF3_EXCLUDED_LIGANDS_REGEX}', regex=True))"
              columns_to_load:
                # columns required for identification, filtering & weighting
                - example_id
                - pdb_id
                - assembly_id
                - resolution
                - num_polymer_pn_units
                - method
                - cluster
                - n_prot
                - n_nuc
                - n_ligand
                # pn_unit specific columns
                - q_pn_unit_iid
                - q_pn_unit_non_polymer_res_names
            transform:
              _target_: datahub.pipelines.rf_diffusion.build_rf_diffusion_transform_pipeline
              crop_size: 384
              crop_contiguous_probability: 0.9
              crop_spatial_probability: 0.1
              diffuser: "${diffuser_hydra}"
              full_config_name: ${hydra:job.config_name}
              chosen_dataset: 'pdb_monomers'
              loader_params: ${dataloader}
              use_ss_adj: true 
              use_bulges: true 
              p_show_bulges: 1.0 
              bulges_min_mask: 0.0 
              bulges_max_mask: 0.0 
              use_twists: true
              p_show_twists: 1.0 
              twists_min_mask: 0.0 
              twists_max_mask: 0.0
          weights:
            _target_: datahub.samplers.calculate_weights_for_pdb_dataset_df
            beta: 0.5
            alphas:
              a_prot: 3.0
              a_nuc: 3.0
              a_ligand: 1.0

    pdb_interface:
      probability: 0.3
      sub_datasets:
        interface:
          dataset:
            _target_: datahub.datasets.base.StructuralDatasetWrapper
            save_failed_examples_to_dir: null
            cif_parser:
              _target_: cifutils.CIFParser
            cif_parser_args:
              load_from_cache: True
              save_to_cache: True
              cache_dir: /net/tukwila/sagardip/rfdiff_train/croppedAFDset_highPDB/pdb_intf
            dataset_parser:
              _target_: datahub.datasets.dataframe_parsers.InterfacesDFParser
            dataset:
              _target_: datahub.datasets.base.PandasDataset
              name: interface
              id_column: example_id
              data: /projects/ml/RF2_allatom/datasets/pdb/2024_09_10/interfaces_df.parquet
              filters:
                - "resolution < 9.0 and ~method.str.contains('NMR')"
                - "num_polymer_pn_units <= 300" 
                - "cluster.notnull()"
                # - "~(pn_unit_1_non_polymer_res_names.notnull() and pn_unit_1_non_polymer_res_names.str.contains('${resolve_import:cifutils.constants.AF3_EXCLUDED_LIGANDS_REGEX}', regex=True))"
                # - "~(pn_unit_2_non_polymer_res_names.notnull() and pn_unit_2_non_polymer_res_names.str.contains('${resolve_import:cifutils.constants.AF3_EXCLUDED_LIGANDS_REGEX}', regex=True))"
                - "is_inter_molecule"
                - "n_prot > 0"
                - "n_ligand > 0"
                - "n_nuc < 1"
              columns_to_load:
                # columns required for identification, filtering & weighting
                - example_id
                - pdb_id
                - assembly_id
                - resolution
                - num_polymer_pn_units
                - method
                - cluster
                - n_prot
                - n_nuc
                - n_ligand
                # interface specific columns
                - pn_unit_1_iid
                - pn_unit_2_iid
                - pn_unit_1_non_polymer_res_names
                - pn_unit_2_non_polymer_res_names
                - is_inter_molecule
            transform:
              _target_: datahub.pipelines.rf_diffusion.build_rf_diffusion_transform_pipeline
              crop_size: 384
              crop_contiguous_probability: 0.0
              crop_spatial_probability: 1.0
              diffuser: "${diffuser_hydra}"
              full_config_name: ${hydra:job.config_name}
              chosen_dataset: 'pdb_interfaces'
              loader_params: ${dataloader}
              use_ss_adj: true
              use_bulges: true
              p_show_bulges: 1.0
              bulges_min_mask: 0.0
              bulges_max_mask: 0.0
              use_twists: true
              p_show_twists: 1.0
              twists_min_mask: 0.0
              twists_max_mask: 0.0
          weights:
            _target_: datahub.samplers.calculate_weights_for_pdb_dataset_df
            beta: 0.5
            alphas:
              a_prot: 3.0
              a_nuc: 3.0
              a_ligand: 1.0

    TMBB:
      probability: 0.5
      sub_datasets:
        beta_berrels:
          dataset: 
            _target_: datahub.datasets.base.StructuralDatasetWrapper
            save_failed_examples_to_dir: null
            cif_parser:
              _target_: cifutils.CIFParser
            cif_parser_args:
              load_from_cache: True
              save_to_cache: True
              cache_dir: /net/tukwila/sagardip/rfdiff_train/croppedAFDset_highPDB/tmbb
            dataset_parser:
              _target_: datahub.datasets.customized_parsers.TMBBParser
            dataset:
              _target_: datahub.datasets.base.PandasDataset
              name: beta_berrals
              id_column: example_id
              data: /home/sagardip/Diffusion/cropped_barrels_intf_buried_TMB_metrics_clustered.parquet
              columns_to_load:
                - example_id
                - confident_pdbpath
                - bulges
                - glycine_twists
                - cluster
                - n_prot
                - n_nuc
                - n_ligand
                - pdb_id
                - assembly_id
            transform:
              _target_: datahub.pipelines.rf_diffusion.build_rf_diffusion_transform_pipeline
              crop_size: 384
              crop_contiguous_probability: 0.7
              crop_spatial_probability: 0.3
              diffuser: "${diffuser_hydra}"
              full_config_name: ${hydra:job.config_name}
              chosen_dataset: 'TMBB'
              loader_params: ${dataloader}
              user_loader_params: # add customized dataloader parameters here
                DIFF_MASK_PROBS:
                  get_closest_tip_atoms: 0.0
                  get_unconditional_diffusion_mask: 0.55
                  get_diffusion_mask_islands: 0.25
                  get_closest_tip_atoms_partial_ligand: 0.0
                  get_diffusion_mask_islands_partial_ligand: 0.0
                  get_unconditional_diffusion_mask_partial_ligand: 0.0
                  get_unconditional_diffusion_mask_free_ligand: 0.0
                  get_atomized_islands: 0.0
                  get_entirely_atomized: 0.0
                  get_diffusion_mask_islands_free_ligand: 0.0
                  get_tip_mask: 0.0
                  get_tip_mask_unconditional_free_ligand: 0.0
                  get_tip_mask_unconditional_partial_ligand: 0.0
                  get_tmbb_strand_motif: 0.2
                mask:
                  min_num_motif: 3
                  max_num_motif: 6
                  min_strand_length: 1
                  max_strand_length: 4
                  select_motif: random
              use_ss_adj: true
              p_is_ss_example: 0.7
              p_is_adj_example: 0.7
              ss_min_mask: 0.1
              ss_max_mask: 0.5
              adj_min_mask: 0.1
              adj_max_mask: 0.5
              adj_strand_pair_min_mask: 0.0
              adj_strand_pair_max_mask: 0.0
              p_any_strand_pairs: 1.0
              use_bulges: true
              p_show_bulges: 1.0
              bulges_min_mask: 0.0
              bulges_max_mask: 1.0
              use_twists: true
              p_show_twists: 1.0
              twists_min_mask: 0.0
              twists_max_mask: 1.0
              p_use_diagonal_mask: 0.7
              diagonal_mask_min: 0.2 
              diagonal_mask_max: 0.7
          weights:
            _target_: datahub.samplers.calculate_weights_for_pdb_dataset_df
            beta: 0.5
            alphas:
              a_prot: 3.0
              a_nuc: 3.0
              a_ligand: 1.0

