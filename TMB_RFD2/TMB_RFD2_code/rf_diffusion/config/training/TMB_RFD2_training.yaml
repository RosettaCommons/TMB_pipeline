guidepost_bonds: true

diffuser:
  diffuse_trans: true
  diffuse_rot: true
  r3:
    min_b: 0.1
    max_b: 20.0
    coordinate_scaling: 0.1
  so3:
    num_omega: 1000
    num_sigma: 1000
    min_sigma: 0.1
    max_sigma: 1.5
    schedule: logarithmic
    cache_dir: .cache/
    use_cached_score: true
  T: 200
  time_type: continuous
  t_distribution: uniform_t001
  type: flow_matching
  min_t: 0.01
  rots:
    train_schedule: linear
    sample_schedule: exp
    exp_rate: 10
  trans:
    train_schedule: linear
    sample_schedule: linear
  sampling:
    num_timesteps: 100
  preserve_motif_sidechains: false

dataloader:
  OMIT_PERMUTATE: false
  RADIAL_CROP: true
  p_msa_mask: 0.0
  use_phospate_frames_for_NA: true
  BLOCKCUT: 5
  CN_DICT: /home/jwatson3/torch/cn_ideal/cn_ideal_train_test.pt
  CN_DIR: /home/jwatson3/torch/cn_ideal
  COMPLEX_HAL_MASK_HIGH: 35
  COMPLEX_HAL_MASK_HIGH_AR: 50
  COMPLEX_HAL_MASK_LOW: 10
  COMPLEX_HAL_MASK_LOW_AR: 20
  COMPL_DIR: /projects/ml/RoseTTAComplex
  COMPL_LIST: /projects/ml/RoseTTAComplex/list.hetero.csv
  CROP: 256
  DATAPKL: ./dataset.pkl
  DATAPKL_AA: aa_dataset_256.pkl
  DATASETS: pdb_aa,compl,sm_complex,sm_compl_covale,metal_compl,sm_compl_asmb,sm_compl_multi
  DATASET_PROB:
  - 0.4
  - 0.2
  - 0.15
  - 0.1
  - 0.05
  - 0.05
  - 0.05
  DATCUT: 2020-Apr-30
  DIFF_MASK_HIGH: 999
  DIFF_MASK_LOW: 20
  DIFF_MASK_PROBS:
    # The function _get_closest_tip_atoms is designed to generate a mask that identifies specific atoms 
    # within protein residues that are closest to a small molecule (such as a ligand), and marks those atoms 
    # for diffusion (modification) during the diffusion process.
    get_closest_tip_atoms: 0.0

    # Mark the whole protein to diffuse
    get_unconditional_diffusion_mask: 0.3

    # The function _get_diffusion_mask_islands is designed to generate a diffusion mask in which certain regions (referred to as "islands") are marked as motifs 
    # (i.e., parts of the structure that should remain constant during diffusion) 
    # and others can optionally serve as guideposts (denoted by can_be_gp).
    get_diffusion_mask_islands: 0.7

    get_closest_tip_atoms_partial_ligand: 0.0
    get_diffusion_mask_islands_partial_ligand: 0.0
    get_unconditional_diffusion_mask_partial_ligand: 0.0

    # Diffuse both protein and ligand
    get_unconditional_diffusion_mask_free_ligand: 0.0
    get_atomized_islands: 0.0
    get_entirely_atomized: 0.0
    get_diffusion_mask_islands_free_ligand: 0.0
    get_tip_mask: 0.0
    get_tip_mask_unconditional_free_ligand: 0.0
    get_tip_mask_unconditional_partial_ligand: 0.0
  DISCONTIGUOUS_CROP: true
  FB_DIR: /projects/ml/TrRosetta/fb_af
  FB_LIST: /projects/ml/TrRosetta/fb_af/list_b1-3.csv
  FLANK_HIGH: 6
  FLANK_LOW: 3
  HAL_MASK_HIGH: 35
  HAL_MASK_HIGH_AR: 50
  HAL_MASK_LOW: 10
  HAL_MASK_LOW_AR: 20
  HOMO_LIST: /projects/ml/RoseTTAComplex/list.homo.csv
  MASK_BROKEN_PROPORTION: 0.5
  MASK_MAX_PROPORTION: 1.0
  MASK_MIN_PROPORTION: 0.2
  MAXCYCLE: 1
  MAXLAT: 256
  MAXSEQ: 1024
  MAXTPLT: 4
  MAX_COMPLEX_CHAIN: 250
  MAX_LENGTH: 256
  MINSEQ: 1
  MINTPLT: 1
  MOL_DIR: /projects/ml/RF2_allatom/rcsb/pkl
  NEGATIVE_LIST: /projects/ml/RoseTTAComplex/list.negative.csv
  PDB_DIR: /projects/ml/TrRosetta/PDB-2021AUG02
  PDB_LIST: /projects/ml/TrRosetta/PDB-2021AUG02/list_v02.csv
  PLDDTCUT: 70.0
  RESCUT: 5.0
  ROWS: 1
  SCCUT: 90.0
  SEQID: 150.0
  SPOOF_ITEM: ''
  STR2SEQ_FULL_HIGH: 1.0
  STR2SEQ_FULL_LOW: 0.9
  USE_GUIDE_POSTS: false
  VAL_COMPL: /projects/ml/RoseTTAComplex/val_lists/xaa
  VAL_NEG: /projects/ml/RoseTTAComplex/val_lists/xaa.neg
  VAL_PDB: /projects/ml/TrRosetta/PDB-2021AUG02/val/xaa
  mask: {}
  P_IS_GUIDEPOST_EXAMPLE: 0.75
  use_fallback: true
  max_residues: -1
  use_validation_config: 0

master_port: 12666

show_dataset:
  show: true
  show_diffused: false
  'n': 10
  show_only_backbone: false

transforms:
  names:
  - AddConditionalInputs
  - CenterPostTransform
  configs:
    PopMask: {}
    Center: {}
    ###### changed
    AddConditionalInputs:
      p_is_guidepost_example: 0.75
      guidepost_bonds: true
    ExpandConditionsDict: {}
    CenterPostTransform:
      jitter: 5.0
      jitter_clip: 20.0
      center_type: all

fm:
  t_normalize_clip: 0.9
  trans_scale: 0.1

extra_tXd: ['radius_of_gyration_v2', 'relative_sasa_v2', 'sinusoidal_timestep_embedding', "ss_adj_cond", "beta_bulges_cond", "glycine_twists_cond"]

extra_tXd_params:
  radius_of_gyration_v2:
    low: 10
    high: 100
    n_bins: 9
  relative_sasa_v2:
    low: 0
    high: 0.2
    n_bins: 3
  sinusoidal_timestep_embedding:
    embedding_dim: 20
    max_positions: 10000
  ss_adj_cond: {}
  beta_bulges_cond: {}
  glycine_twists_cond: {}

rf:
  model:
    use_chiral_l1: True
    use_lj_l1: True
    use_atom_frames: True
    use_same_chain: True
    recycling_type: all
    enable_same_chain: True
    refiner_topk: 128
    d_t1d: 125  # 114 + N_SS(5) + N_bulges(3) + N_twists(3)
    d_t2d: 72  # 68 + N_AD(4)

